<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Credit LAP Voice Agent Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <p class="eyebrow">SalesAgents AI assignment</p>
        <h1>Home Credit LAP qualification agent</h1>
        <p class="subhead">Interactive demonstration of the required voice-agent state machine.</p>
      </div>
      <div class="header-actions"><span id="status" class="badge in_progress">in progress</span><button id="reset" class="secondary">New call</button></div>
    </header>
    <section class="grid">
      <div class="card conversation">
        <div class="card-title"><h2>Live call transcript</h2><span id="progress">0/7 checklist items</span></div>
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <form id="message-form" class="composer">
          <input id="customer-input" autocomplete="off" placeholder="Type what the customer says..." aria-label="Customer utterance">
          <button id="send" type="submit">Send</button>
        </form>
      </div>
      <aside class="card">
        <div class="card-title"><h2>Qualification state</h2></div>
        <div id="state-panel"></div>
        <h3>Quick scenarios</h3>
        <div class="scenarios">
          <button data-scenario="happy">Happy path</button>
          <button data-scenario="outOfOrder">Out-of-order capture</button>
          <button data-scenario="agricultural">Agricultural disqualification</button>
          <button data-scenario="transfer">Loan transfer</button>
          <button data-scenario="busy">Busy callback</button>
        </div>
      </aside>
    </section>
    <footer><a href="system-prompt.txt">View system prompt</a><a href="TEST_SCENARIOS.md">View test plan</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
